<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business X-Ray — MIRK Technologies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#000000;
  --panel:#0a0a0a;
  --panel2:#0d0d0d;
  --border:#1a1a1a;
  --border2:#222;
  --green:#00ff88;
  --amber:#f5a623;
  --red:#ff3b3b;
  --white:#ffffff;
  --gray:#8a8a8a;
  --divider:#333;
  --font-display:'Space Grotesk',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
html,body{height:100%;background:var(--black);color:var(--white);font-family:var(--font-display);overflow-x:hidden}
body{display:flex;flex-direction:column;min-height:100vh}

/* NAV */
.nav{display:flex;gap:0;border-bottom:1px solid var(--border2);padding:0 24px;background:var(--panel)}
.nav-btn{background:none;border:none;color:var(--gray);font-family:var(--font-display);font-size:13px;font-weight:500;letter-spacing:.08em;padding:14px 20px;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;text-transform:uppercase}
.nav-btn.active{color:var(--white);border-bottom-color:var(--green)}
.nav-btn:hover:not(.active){color:var(--white)}

/* PAGES */
.page{display:none;flex:1;flex-direction:column}
.page.active{display:flex}

/* ===== PAGE 1: X-RAY ===== */
/* HEADER */
.xray-header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--border2);gap:16px;flex-shrink:0}
.header-left{}
.header-eyebrow{font-size:9px;letter-spacing:.2em;color:var(--gray);text-transform:uppercase;margin-bottom:4px}
.header-logo{font-size:22px;font-weight:700;letter-spacing:.04em;color:var(--white)}
.header-logo span{color:var(--green)}
.header-meta{font-size:11px;color:var(--gray);margin-top:3px;letter-spacing:.04em}
.header-meta b{color:var(--white)}

.header-center{text-align:center}
.leak-box{border:1px solid var(--border2);padding:10px 20px;position:relative}
.leak-label{font-size:9px;letter-spacing:.18em;color:var(--green);text-transform:uppercase;margin-bottom:4px}
.leak-label.danger{color:var(--red)}
.leak-amount{font-family:var(--font-mono);font-size:36px;font-weight:700;line-height:1;color:var(--white);white-space:nowrap}
.leak-amount.red{color:var(--red)}
.leak-amount.green{color:var(--green)}
.leak-sub{font-size:10px;letter-spacing:.1em;color:var(--gray);text-transform:uppercase;margin-top:4px}
.recovered-box{background:rgba(0,255,136,.07);border:1px solid rgba(0,255,136,.3);padding:6px 16px;margin-top:8px;text-align:center;display:none}
.recovered-box.visible{display:block}
.recovered-label{font-size:9px;letter-spacing:.15em;color:var(--green);text-transform:uppercase}
.recovered-amount{font-family:var(--font-mono);font-size:20px;font-weight:700;color:var(--green)}

.header-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.toggle-wrap{display:flex;align-items:center;gap:10px}
.toggle-label{font-size:10px;letter-spacing:.1em;color:var(--gray);text-transform:uppercase}
.toggle-label.active-label{color:var(--white)}
.toggle{position:relative;width:44px;height:24px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-track{position:absolute;inset:0;border-radius:12px;background:#1a1a1a;border:1px solid #333;transition:background .4s}
.toggle input:checked~.toggle-track{background:rgba(0,255,136,.15);border-color:var(--green)}
.toggle-thumb{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--red);transition:transform .4s,background .4s}
.toggle input:checked~.toggle-thumb{transform:translateX(20px);background:var(--green)}
.toggle-hint{font-size:9px;letter-spacing:.1em;color:#444;text-transform:uppercase;text-align:right}

/* CANVAS */
.canvas-wrap{flex:1;position:relative;overflow:hidden;min-height:0}
#xray-svg{width:100%;height:100%;display:block}

/* NODE PANEL */
.node-panel{position:absolute;top:0;right:0;width:320px;height:100%;background:var(--panel2);border-left:1px solid var(--border2);transform:translateX(100%);transition:transform .3s ease-out;overflow-y:auto;z-index:10;padding:24px}
.node-panel.open{transform:translateX(0)}
.panel-close{position:absolute;top:16px;right:16px;background:none;border:1px solid var(--border2);color:var(--gray);width:28px;height:28px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.panel-close:hover{color:var(--white);border-color:var(--gray)}
.panel-title{font-size:20px;font-weight:600;margin-bottom:16px;padding-right:40px}
.panel-section-label{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--gray);margin-bottom:8px;margin-top:20px}
.panel-diagnosis{font-size:13px;color:#ccc;line-height:1.7}
.panel-diagnosis b{color:var(--white)}
.panel-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:16px 0}
.stat-box{border:1px solid var(--border2);padding:10px 8px;text-align:center}
.stat-label{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--gray);margin-bottom:4px}
.stat-value{font-family:var(--font-mono);font-size:16px;font-weight:700}
.stat-value.red{color:var(--red)}
.stat-value.green{color:var(--green)}
.stat-unit{font-size:9px;color:var(--gray)}
.ai-system-box{background:#0f1a0f;border:1px solid rgba(245,166,35,.3);padding:16px;margin-top:4px}
.ai-system-name{font-size:14px;font-weight:600;color:var(--amber);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.ai-system-desc{font-size:12px;color:#aaa;line-height:1.7;border-bottom:1px solid var(--border2);padding-bottom:12px;margin-bottom:12px}
.ai-build-row{display:flex;justify-content:space-between;align-items:center}
.ai-build-label{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--gray)}
.ai-build-cost{font-family:var(--font-mono);font-size:18px;font-weight:700;color:var(--white)}
.ai-build-type{font-size:10px;color:var(--gray)}
.panel-impact{font-size:12px;color:#aaa;line-height:1.7;margin-top:12px}
.panel-impact span{color:var(--green);font-weight:600}
.panel-impact b{color:var(--white)}

/* STATUS BAR */
.status-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 24px;background:var(--panel);border-top:1px solid var(--border2);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray);flex-shrink:0}
.legend{display:flex;gap:16px;align-items:center}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-dot{width:8px;height:8px;border-radius:50%}
.scan-info{font-family:var(--font-mono);font-size:10px}

/* ===== PAGE 2: EXECUTIVE SUMMARY ===== */
.exec-page{padding:32px;max-width:1000px;margin:0 auto;width:100%}
.exec-header{margin-bottom:32px;border-bottom:1px solid var(--divider);padding-bottom:24px}
.exec-eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--green);margin-bottom:8px}
.exec-title{font-size:28px;font-weight:700;margin-bottom:4px}
.exec-meta{font-size:13px;color:var(--gray)}

.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px}
.kpi-card{background:var(--panel);border:1px solid var(--border2);padding:20px}
.kpi-label{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--gray);margin-bottom:8px}
.kpi-value{font-family:var(--font-mono);font-size:28px;font-weight:700}
.kpi-value.red{color:var(--red)}
.kpi-value.green{color:var(--green)}
.kpi-value.amber{color:var(--amber)}
.kpi-sub{font-size:11px;color:var(--gray);margin-top:4px}

.section-title{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gray);margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--border2)}

.findings-table{width:100%;border-collapse:collapse;margin-bottom:32px;font-size:13px}
.findings-table th{text-align:left;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--gray);padding:8px 12px;border-bottom:1px solid var(--border2);font-weight:400}
.findings-table td{padding:10px 12px;border-bottom:1px solid var(--border)}
.findings-table tr:last-child td{border-bottom:none}
.findings-table tr.leaking td{background:rgba(255,59,59,.03)}
.findings-table tr.nominal td{opacity:.5}
.status-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;letter-spacing:.08em;padding:3px 8px;text-transform:uppercase}
.status-badge.leaking{color:var(--red);background:rgba(255,59,59,.1);border:1px solid rgba(255,59,59,.2)}
.status-badge.at-risk{color:var(--amber);background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.2)}
.status-badge.nominal{color:var(--gray);background:rgba(255,255,255,.05);border:1px solid var(--border2)}
.mono{font-family:var(--font-mono)}
.red{color:var(--red)}
.green{color:var(--green)}
.amber{color:var(--amber)}

.recs-grid{display:flex;flex-direction:column;gap:16px;margin-bottom:32px}
.rec-card{background:var(--panel);border:1px solid var(--border2);padding:20px;display:grid;grid-template-columns:48px 1fr auto;gap:16px;align-items:start}
.rec-card.critical{border-left:3px solid var(--red)}
.rec-card.high{border-left:3px solid var(--amber)}
.rec-card.medium{border-left:3px solid #555}
.rec-card.low{border-left:3px solid #333}
.rec-num{font-family:var(--font-mono);font-size:28px;font-weight:700;color:var(--border2);line-height:1;padding-top:2px}
.rec-body{}
.rec-urgency{font-size:9px;letter-spacing:.15em;text-transform:uppercase;font-weight:600;margin-bottom:6px}
.rec-urgency.Critical{color:var(--red)}
.rec-urgency.High{color:var(--amber)}
.rec-urgency.Medium{color:#888}
.rec-urgency.Low{color:#555}
.rec-title{font-size:15px;font-weight:600;margin-bottom:8px}
.rec-desc{font-size:13px;color:#aaa;line-height:1.7;margin-bottom:12px}
.rec-timeframe{font-size:11px;color:var(--gray)}
.rec-metrics{text-align:right;min-width:140px}
.rec-metric-row{margin-bottom:8px}
.rec-metric-label{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--gray)}
.rec-metric-value{font-family:var(--font-mono);font-size:16px;font-weight:700}
.rec-type-header{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--gray);padding:8px 0;margin:8px 0 4px;border-top:1px solid var(--border2)}
.rec-type-header:first-child{border-top:none;margin-top:0}

.investment-bar{background:var(--panel);border:1px solid rgba(0,255,136,.2);padding:16px 24px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px}
.inv-item{text-align:center}
.inv-label{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--gray);margin-bottom:4px}
.inv-value{font-family:var(--font-mono);font-size:20px;font-weight:700;color:var(--green)}

.exec-footer{border-top:1px solid var(--border2);padding-top:16px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--gray)}
.exec-footer a{color:var(--green);text-decoration:none}

/* ANIMATIONS */
@keyframes leak-pulse{
  0%,100%{filter:drop-shadow(0 0 4px var(--red)) drop-shadow(0 0 0px var(--red))}
  50%{filter:drop-shadow(0 0 12px var(--red)) drop-shadow(0 0 24px rgba(255,59,59,.3))}
}
@keyframes risk-pulse{
  0%,100%{filter:drop-shadow(0 0 3px var(--amber))}
  50%{filter:drop-shadow(0 0 10px var(--amber))}
}
@keyframes nominal-glow{
  0%,100%{filter:drop-shadow(0 0 2px rgba(245,166,35,.4))}
  50%{filter:drop-shadow(0 0 6px rgba(245,166,35,.6))}
}
.node-leaking{animation:leak-pulse 2s ease-in-out infinite}
.node-at-risk{animation:risk-pulse 2.5s ease-in-out infinite}
.node-nominal{animation:nominal-glow 3s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){
  .node-leaking,.node-at-risk,.node-nominal{animation:none}
  .particle{display:none}
}
</style>
</head>

  <div class="xray-header">

      <div class="header-eyebrow">AI Operations Audit &middot; Live</div>

<script>
// ─── STATE ───────────────────────────────────────────────────────────────────
let aiMode = false;
let leakStart = Date.now();
let pageLoadTime = Date.now();
let animFrame;
let particles = [];
let svgPaths = {}; // id -> {el, length}
let nodeEls = {};  // id -> {circle, group}
let pathMap = {};  // connection index -> {from, to, pathEl}

// ─── INIT ─────────────────────────────────────────────────────────────────────
function init(){
  buildHeader();
  buildExecPage();
  buildSVG();
  buildScoreInfo();
  startCounters();
  document.getElementById('ai-toggle').addEventListener('change', toggleAI);
}

function buildHeader(){
  const m = AUDIT_DATA.meta;
  document.getElementById('header-meta').innerHTML =
    `<b>${m.businessName}</b> &middot; ${m.industry} &middot; ${m.location} &middot; ${m.annualRevenue} &middot; ${m.employeeCount} employees`;
  document.getElementById('leak-sub').textContent =
    `Quoting + Invoicing + Follow-Up · $${AUDIT_DATA.financials.monthlyBleed.toLocaleString()}/mo bleeding`;
  document.getElementById('recovered-amount').textContent =
    `$${AUDIT_DATA.financials.recoveredWithAI.toLocaleString()}/year`;
}

function buildScoreInfo(){
  const leaking = AUDIT_DATA.nodes.filter(n=>n.status==='leaking').length;
  const total = AUDIT_DATA.nodes.length;
  document.getElementById('scan-info').textContent =
    `Scan // ${total} Process Nodes · ${leaking} Critical`;
}

// ─── COUNTERS ────────────────────────────────────────────────────────────────
let displayedLeak = 0;
let targetLeak = 0;
let leakPerSec = AUDIT_DATA.financials.totalAnnualLeak / (365 * 24 * 3600);
let residualPerSec = AUDIT_DATA.financials.residualLeakWithAI / (365 * 24 * 3600);

function startCounters(){
  leakStart = Date.now();
  displayedLeak = 0;
  updateCounters();
}

function updateCounters(){
  const elapsed = (Date.now() - leakStart) / 1000;
  const rate = aiMode ? residualPerSec : leakPerSec;
  const base = aiMode ? AUDIT_DATA.financials.residualLeakWithAI : 0;
  const running = aiMode ? base : elapsed * rate;
  const annual = aiMode ? AUDIT_DATA.financials.residualLeakWithAI : AUDIT_DATA.financials.totalAnnualLeak;

  // Show running tally up to the annual cap
  const shown = Math.min(running, annual);
  document.getElementById('leak-amount').textContent = '$' + shown.toFixed(2) + '/YR';

  // Uptime counter
  const up = Math.floor((Date.now() - pageLoadTime) / 1000);
  const hh = String(Math.floor(up/3600)).padStart(2,'0');
  const mm = String(Math.floor((up%3600)/60)).padStart(2,'0');
  const ss = String(up%60).padStart(2,'0');
  document.getElementById('scan-counter').textContent =
    `T+${hh}:${mm}:${ss} · Audit Mode`;

  requestAnimationFrame(updateCounters);
}

// ─── SVG CANVAS ───────────────────────────────────────────────────────────────
// Node layout positions (percent of SVG dimensions)
const NODE_LAYOUT = {
  'lead-intake':     {x:0.10, y:0.42},
  'quoting':         {x:0.24, y:0.62},
  'scheduling':      {x:0.42, y:0.28},
  'crew-dispatch':   {x:0.58, y:0.58},
  'job-completion':  {x:0.72, y:0.28},
  'invoicing':       {x:0.84, y:0.52},
  'collections':     {x:0.92, y:0.72},
  'customer-follow-up': {x:0.50, y:0.80}
};

const NODE_R = 34; // radius

function buildSVG(){
  const svg = document.getElementById('xray-svg');
  const wrap = document.getElementById('canvas-wrap');
  const W = wrap.clientWidth || 1200;
  const H = wrap.clientHeight || 600;

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  // Defs for glow filters
  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML = `
    <filter id="glow-red" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-green" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-amber" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  `;
  svg.appendChild(defs);

  // Connections first (behind nodes)
  const connLayer = document.createElementNS('http://www.w3.org/2000/svg','g');
  connLayer.id = 'conn-layer';
  svg.appendChild(connLayer);

  const particleLayer = document.createElementNS('http://www.w3.org/2000/svg','g');
  particleLayer.id = 'particle-layer';
  svg.appendChild(particleLayer);

  const nodeLayer = document.createElementNS('http://www.w3.org/2000/svg','g');
  nodeLayer.id = 'node-layer';
  svg.appendChild(nodeLayer);

  // Build node position map
  const positions = {};
  AUDIT_DATA.nodes.forEach(node => {
    const rel = NODE_LAYOUT[node.id] || {x:0.5,y:0.5};
    positions[node.id] = {x: rel.x * W, y: rel.y * H};
  });

  // Draw connections
  AUDIT_DATA.connections.forEach((conn, i) => {
    const p1 = positions[conn.from];
    const p2 = positions[conn.to];
    if(!p1 || !p2) return;

    const fromNode = AUDIT_DATA.nodes.find(n=>n.id===conn.from);
    const toNode = AUDIT_DATA.nodes.find(n=>n.id===conn.to);

    // Bezier control points
    const dx = p2.x - p1.x;
    const dy = p2.y - p1.y;
    const cx1 = p1.x + dx * 0.4 + dy * 0.15;
    const cy1 = p1.y + dy * 0.1 - dx * 0.05;
    const cx2 = p2.x - dx * 0.4 + dy * 0.15;
    const cy2 = p2.y - dy * 0.1 - dx * 0.05;

    const pathD = `M ${p1.x} ${p1.y} C ${cx1} ${cy1} ${cx2} ${cy2} ${p2.x} ${p2.y}`;

    const pathEl = document.createElementNS('http://www.w3.org/2000/svg','path');
    pathEl.setAttribute('d', pathD);
    pathEl.setAttribute('fill','none');
    pathEl.setAttribute('stroke-width','1.5');
    pathEl.setAttribute('stroke-dasharray','4 4');
    pathEl.setAttribute('opacity','0.6');
    pathEl.classList.add('conn-path');
    pathEl.dataset.from = conn.from;
    pathEl.dataset.to = conn.to;

    const isLeakPath = (toNode && toNode.status === 'leaking') || (fromNode && fromNode.status === 'leaking');
    pathEl.setAttribute('stroke', isLeakPath ? '#ff3b3b' : '#f5a623');

    connLayer.appendChild(pathEl);

    const len = pathEl.getTotalLength ? pathEl.getTotalLength() : 200;

    // Spawn particles on this path
    const numParticles = Math.max(2, Math.floor(len / 80));
    for(let p = 0; p < numParticles; p++){
      const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
      dot.setAttribute('r','3');
      dot.setAttribute('opacity','0.85');
      const particleColor = isLeakPath ? '#ff3b3b' : '#f5a623';
      dot.setAttribute('fill', particleColor);
      particleLayer.appendChild(dot);

      particles.push({
        el: dot,
        pathEl: pathEl,
        len: len,
        progress: p / numParticles,
        speed: 0.0015 + Math.random() * 0.001,
        isLeak: isLeakPath,
        fromId: conn.from,
        toId: conn.to
      });
    }
  });

  // Draw nodes
  AUDIT_DATA.nodes.forEach(node => {
    const pos = positions[node.id];
    if(!pos) return;

    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.style.cursor = node.aiFixAvailable ? 'pointer' : 'default';
    g.dataset.nodeId = node.id;

    if(node.aiFixAvailable){
      g.addEventListener('click', () => openPanel(node.id));
    }

    // Outer ring
    const ringColor = node.status === 'leaking' ? '#ff3b3b' :
                      node.status === 'at-risk'  ? '#f5a623' : '#f5a623';

    const outerRing = document.createElementNS('http://www.w3.org/2000/svg','circle');
    outerRing.setAttribute('cx', pos.x);
    outerRing.setAttribute('cy', pos.y);
    outerRing.setAttribute('r', NODE_R);
    outerRing.setAttribute('fill','none');
    outerRing.setAttribute('stroke', ringColor);
    outerRing.setAttribute('stroke-width', node.status === 'leaking' ? '2.5' : '1.5');
    outerRing.classList.add('node-ring');

    // Inner circle
    const inner = document.createElementNS('http://www.w3.org/2000/svg','circle');
    inner.setAttribute('cx', pos.x);
    inner.setAttribute('cy', pos.y);
    inner.setAttribute('r', NODE_R - 8);
    inner.setAttribute('fill','#080808');
    inner.setAttribute('stroke','#1a1a1a');
    inner.setAttribute('stroke-width','1');

    // Center dot
    const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('cx', pos.x);
    dot.setAttribute('cy', pos.y);
    dot.setAttribute('r', node.status === 'leaking' ? 8 : 5);
    dot.setAttribute('fill', node.status === 'leaking' ? '#ff3b3b' :
                              node.status === 'at-risk' ? '#f5a623' : '#1e3a2e');
    dot.classList.add('node-dot');

    // Label
    const label = document.createElementNS('http://www.w3.org/2000/svg','text');
    label.setAttribute('x', pos.x);
    label.setAttribute('y', pos.y + NODE_R + 16);
    label.setAttribute('text-anchor','middle');
    label.setAttribute('fill','#ffffff');
    label.setAttribute('font-family',"'Space Grotesk',sans-serif");
    label.setAttribute('font-size','12');
    label.setAttribute('font-weight','600');
    label.setAttribute('letter-spacing','0.06em');
    label.textContent = node.label.toUpperCase();

    // Sub label
    const sublabel = document.createElementNS('http://www.w3.org/2000/svg','text');
    sublabel.setAttribute('x', pos.x);
    sublabel.setAttribute('y', pos.y + NODE_R + 30);
    sublabel.setAttribute('text-anchor','middle');
    sublabel.setAttribute('font-family',"'Space Grotesk',sans-serif");
    sublabel.setAttribute('font-size','9');
    sublabel.setAttribute('letter-spacing','0.14em');
    sublabel.classList.add('node-sublabel');

    if(node.status === 'leaking'){
      sublabel.setAttribute('fill','#ff3b3b');
      sublabel.textContent = `⚠ LEAKING · -$${(node.monthlyBleed/1000).toFixed(1)}K/MO`;
    } else {
      sublabel.setAttribute('fill','#555');
      sublabel.textContent = 'NOMINAL';
    }

    // Hover tooltip for clickable nodes
    if(node.aiFixAvailable){
      const tipG = document.createElementNS('http://www.w3.org/2000/svg','g');
      tipG.classList.add('node-tip');
      tipG.setAttribute('opacity','0');
      tipG.style.transition = 'opacity .2s';

      const tipRect = document.createElementNS('http://www.w3.org/2000/svg','rect');
      const tipText = `△ VIEW AI FIX — ${node.label.toUpperCase()}`;
      const tipW = tipText.length * 7 + 24;
      tipRect.setAttribute('x', pos.x - tipW/2);
      tipRect.setAttribute('y', pos.y - NODE_R - 36);
      tipRect.setAttribute('width', tipW);
      tipRect.setAttribute('height', 24);
      tipRect.setAttribute('fill','#111');
      tipRect.setAttribute('stroke','#333');
      tipRect.setAttribute('stroke-width','1');
      tipRect.setAttribute('rx','2');

      const tipTxt = document.createElementNS('http://www.w3.org/2000/svg','text');
      tipTxt.setAttribute('x', pos.x);
      tipTxt.setAttribute('y', pos.y - NODE_R - 20);
      tipTxt.setAttribute('text-anchor','middle');
      tipTxt.setAttribute('fill','#ccc');
      tipTxt.setAttribute('font-family',"'Space Grotesk',sans-serif");
      tipTxt.setAttribute('font-size','10');
      tipTxt.setAttribute('letter-spacing','0.06em');
      tipTxt.textContent = tipText;

      tipG.appendChild(tipRect);
      tipG.appendChild(tipTxt);

      g.addEventListener('mouseenter', ()=>{ tipG.setAttribute('opacity','1'); });
      g.addEventListener('mouseleave', ()=>{ tipG.setAttribute('opacity','0'); });
      g.appendChild(tipG);
    }

    // Animation class on the group
    const animClass = node.status === 'leaking' ? 'node-leaking' :
                      node.status === 'at-risk'  ? 'node-at-risk'  : 'node-nominal';

    g.appendChild(outerRing);
    g.appendChild(inner);
    g.appendChild(dot);
    g.appendChild(label);
    g.appendChild(sublabel);
    g.classList.add(animClass);
    nodeLayer.appendChild(g);

    nodeEls[node.id] = {group:g, ring:outerRing, dot, sublabel};
  });

  // Start particle animation
  animateParticles();
}

// ─── PARTICLES ────────────────────────────────────────────────────────────────
function animateParticles(){
  particles.forEach(p => {
    p.progress += p.speed;
    if(p.progress > 1) p.progress -= 1;

    try {
      const pt = p.pathEl.getPointAtLength(p.progress * p.len);
      p.el.setAttribute('cx', pt.x);
      p.el.setAttribute('cy', pt.y);
    } catch(e){}
  });
  requestAnimationFrame(animateParticles);
}

function updateParticleColors(){
  particles.forEach(p => {
    const toNode = AUDIT_DATA.nodes.find(n=>n.id===p.toId);
    const fromNode = AUDIT_DATA.nodes.find(n=>n.id===p.fromId);
    const isLeak = !aiMode && ((toNode && toNode.status==='leaking') || (fromNode && fromNode.status==='leaking'));
    p.el.setAttribute('fill', aiMode ? '#00ff88' : (isLeak ? '#ff3b3b' : '#f5a623'));
    p.el.setAttribute('opacity', aiMode ? '0.7' : '0.85');
  });

  // Update path colors too
  document.querySelectorAll('.conn-path').forEach(path => {
    const toId = path.dataset.to;
    const fromId = path.dataset.from;
    const toNode = AUDIT_DATA.nodes.find(n=>n.id===toId);
    const fromNode = AUDIT_DATA.nodes.find(n=>n.id===fromId);
    const isLeak = !aiMode && ((toNode && toNode.status==='leaking') || (fromNode && fromNode.status==='leaking'));
    path.setAttribute('stroke', aiMode ? '#00ff88' : (isLeak ? '#ff3b3b' : '#f5a623'));
    path.setAttribute('opacity', aiMode ? '0.4' : '0.6');
  });
}

function updateNodeStyles(){
  AUDIT_DATA.nodes.forEach(node => {
    const els = nodeEls[node.id];
    if(!els) return;
    const {group, ring, dot, sublabel} = els;

    if(aiMode){
      ring.setAttribute('stroke','#00ff88');
      ring.setAttribute('stroke-width','1.5');
      dot.setAttribute('fill','#00ff88');
      dot.setAttribute('r','5');
      sublabel.setAttribute('fill','#00ff88');
      sublabel.textContent = '✓ AUTOMATED';
      group.classList.remove('node-leaking','node-at-risk','node-nominal');
    } else {
      const color = node.status==='leaking' ? '#ff3b3b' :
                    node.status==='at-risk'  ? '#f5a623' : '#f5a623';
      ring.setAttribute('stroke', color);
      ring.setAttribute('stroke-width', node.status==='leaking' ? '2.5' : '1.5');
      dot.setAttribute('fill', node.status==='leaking' ? '#ff3b3b' :
                                node.status==='at-risk'  ? '#f5a623' : '#1e3a2e');
      dot.setAttribute('r', node.status==='leaking' ? '8' : '5');

      if(node.status==='leaking'){
        sublabel.setAttribute('fill','#ff3b3b');
        sublabel.textContent = `⚠ LEAKING · -$${(node.monthlyBleed/1000).toFixed(1)}K/MO`;
        group.classList.add('node-leaking');
        group.classList.remove('node-at-risk','node-nominal');
      } else {
        sublabel.setAttribute('fill','#555');
        sublabel.textContent = 'NOMINAL';
        group.classList.remove('node-leaking','node-at-risk');
        group.classList.add('node-nominal');
      }
    }
  });
}

    <div class="investment-bar">
      <div class="inv-item">
        <div class="inv-label">Total Build Investment</div>
        <div class="inv-value">$${totalInvestment.toLocaleString()}</div>
      </div>
      <div class="inv-item">
        <div class="inv-label">Projected Annual Recovery</div>
        <div class="inv-value">$${totalReturn.toLocaleString()}</div>
      </div>
      <div class="inv-item">
        <div class="inv-label">Average ROI</div>
        <div class="inv-value">${avgRoi} weeks</div>
      </div>
    </div>

    <div class="exec-footer">
      <span>Prepared by MIRK Technologies &middot; <a href="https://mirktechnologies.com">mirktechnologies.com</a></span>
      <span>${m.analystName}, Founder &middot; ian@mirktechnologies.com</span>
    </div>
  `;
}

// ─── PAGE NAV ─────────────────────────────────────────────────────────────────
function showPage(id, btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  btn.classList.add('active');
}

// ─── RESIZE ───────────────────────────────────────────────────────────────────
window.addEventListener('resize', ()=>{
  const svg = document.getElementById('xray-svg');
  const wrap = document.getElementById('canvas-wrap');
  const W = wrap.clientWidth;
  const H = wrap.clientHeight;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  // Rebuild on resize for accurate layout
  svg.innerHTML='';
  particles=[];
  nodeEls={};
  buildSVG();
});

// ─── START ────────────────────────────────────────────────────────────────────
window.addEventListener('load', init);
</script>
